version: "3.8"

services:
  mongodb:
    image: mongo:4.4
    container_name: nexushome-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: nexushome
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db